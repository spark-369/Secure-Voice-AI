worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # WebSocket upgrade mapping (chat socket lives under /api/v1/ws/)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Basic abuse protection in front of the API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream securevoice_backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 10m;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- API: REST + WebSocket --------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass http://securevoice_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---- Swagger UI / OpenAPI (development convenience) --------------
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://securevoice_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---- Hashed, immutable static assets ------------------------------
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location = /favicon.svg {
            expires 7d;
            try_files $uri =404;
        }

        # ---- SPA fallback ---------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
